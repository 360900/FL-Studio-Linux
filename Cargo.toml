[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ico = "0.6"
# Only the resource reader is used; the default features add mmap and winapi.
pelite = { version = "0.10", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# `~`: the winit accessor used by the app is only stable within a minor release.
slint = "~1.18"
slint-build = "~1.18"
tempfile = "3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[profile.release]
strip = true
